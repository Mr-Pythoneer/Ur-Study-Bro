<!--
  ══════════════════════════════════════════════════════════════════════════
  CALENDAR PAGE
  ══════════════════════════════════════════════════════════════════════════
  A page fragment (not a standalone document): renderer/index.html's loadPage()
  fetches this file and injects it into the app shell. There is no <html>/<head>
  here on purpose.

  What it does
    • Three views of the user's events — Month / Week / List — plus an
      "Upcoming (Next 7 Days)" mini list in the sidebar.
    • An add-event form that parses a pasted meeting URL (Zoom / Google Meet /
      Teams / generic) and canonicalises it.
    • A detail modal with "Join & Take Notes", which opens the meeting link in
      the OS browser and hands the event off to meetings.html.

  Storage contract
    • Events live under the per-account key 'calEvents' via csGetJSON/csSetJSON
      (window helpers, real key is cs_<user>_calEvents). Switching accounts
      switches calendars; there is no shared/global calendar.
    • Event shape: { id, title, date:'YYYY-MM-DD', start:'HH:MM', end:'HH:MM',
      link, linkType, linkLabel, repeat }. Dates and times are LOCAL wall-clock
      strings, never Date objects and never UTC. Times are zero-padded 24h, so
      plain string comparison (`end <= start`, sort by date+start) is ordering.

  Before you edit — loadPage() gotchas
    • Every <script> in this file is RE-CREATED and RE-EXECUTED in GLOBAL scope
      on EVERY visit to the page. The IIFE below exists solely to keep these
      helpers off `window` and to avoid "already declared" errors on revisit.
    • Anything you attach to window must therefore be safe to re-assign on every
      visit (window._calDelete is — it is a plain overwrite).
    • Inline onclick="..." handlers only resolve against globals. That is the
      whole reason _calDelete is hung on window while everything else is IIFE
      local; an IIFE-local function silently does nothing from an inline handler.
    • This page registers NO window._pageCleanup because it starts no interval
      and no listener on window/document that outlives the fragment. Every
      listener is bound to a node inside the injected DOM (discarded on
      navigation) or to a modal it removes itself. If you add a setInterval or a
      document-level listener here, you MUST register cleanup or the app leaks
      one more of them per visit.
    • The <style> block below is injected into the live document, so its rules
      are global while this page is mounted. Class names are prefixed (cal-,
      month-, week-, list-) to avoid colliding with other pages.
-->
<style>
  /* ── Layout ───────────────────────────────────────────────── */
  .cal-wrap { display:flex; gap:20px; align-items:flex-start; }
  .cal-main { flex:1; min-width:0; }
  .cal-sidebar { width:300px; flex-shrink:0; display:flex; flex-direction:column; gap:16px; }

  /* ── View toggle ──────────────────────────────────────────── */
  .view-toggle { display:flex; gap:4px; background:#f3f4f6; border-radius:10px; padding:4px; }
  .view-btn { flex:1; padding:7px; border:none; border-radius:8px; font-family:var(--font); font-size:13px; font-weight:600; cursor:pointer; background:transparent; color:var(--text-secondary); transition:all .15s; }
  .view-btn.active { background:#fff; color:var(--text-primary); box-shadow:0 1px 4px rgba(0,0,0,.1); }

  /* ── Month header ─────────────────────────────────────────── */
  .cal-nav { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .cal-nav-title { font-size:18px; font-weight:700; color:var(--text-primary); }
  .cal-nav-btns { display:flex; gap:6px; }
  .cal-nav-btn { padding:6px 14px; font-size:15px; }

  /* ── Month grid ───────────────────────────────────────────── */
  .month-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:0; border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; }
  .month-header-cell { background:#f9fafb; padding:8px 4px; text-align:center; font-size:11px; font-weight:700; color:var(--text-secondary); letter-spacing:.4px; border-bottom:1px solid var(--border); }
  .month-cell { min-height:90px; padding:6px; border-right:1px solid var(--border); border-bottom:1px solid var(--border); cursor:pointer; transition:background .12s; position:relative; vertical-align:top; }
  /* The 7 .month-header-cell children fill exactly one grid row, so they offset the
     day cells by a whole week: nth-child(7n) therefore lands on the last column.
     Adding or removing a header cell silently moves this border to the wrong column. */
  .month-cell:nth-child(7n) { border-right:none; }
  .month-cell:hover { background:#f0fdf7; }
  .month-cell.other-month { background:#f9fafb; }
  .month-cell.other-month .day-num { color:#d1d5db; }
  .month-cell.today { background:#f0fdf7; }
  .month-cell.today .day-num { background:var(--accent); color:#fff; border-radius:50%; width:24px; height:24px; display:flex; align-items:center; justify-content:center; }
  .day-num { font-size:13px; font-weight:600; color:var(--text-primary); margin-bottom:4px; width:24px; height:24px; display:flex; align-items:center; justify-content:center; }
  .day-events { display:flex; flex-direction:column; gap:2px; }
  .event-pill { font-size:10px; font-weight:600; border-radius:4px; padding:2px 5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:pointer; }
  /* These modifier names are the event's `linkType` verbatim (see parseLink). The set
     zoom|meet|teams|other|none must stay in sync with TYPE_ICONS and dotColor() in the
     script, otherwise a link type renders unstyled/uncoloured rather than failing loudly. */
  .event-pill.zoom    { background:#e8f0ff; color:#1a56db; }
  .event-pill.meet    { background:#fce8ff; color:#7c3aed; }
  .event-pill.teams   { background:#e8f5ff; color:#0369a1; }
  .event-pill.other   { background:var(--accent-light); color:var(--accent); }
  .more-label { font-size:10px; color:var(--text-secondary); padding:1px 5px; cursor:pointer; }

  /* ── Week grid ────────────────────────────────────────────── */
  .week-grid { border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; }
  .week-header-row { display:grid; grid-template-columns:60px repeat(7,1fr); background:#f9fafb; border-bottom:1px solid var(--border); }
  .week-header-cell { padding:8px 6px; text-align:center; font-size:11px; font-weight:700; color:var(--text-secondary); }
  .week-header-cell.today-col { color:var(--accent); }
  .week-body { display:grid; grid-template-columns:60px repeat(7,1fr); max-height:520px; overflow-y:auto; }
  /* One row per hour, fixed 40px tall. renderWeek() positions an event block with a
     percentage `top` derived from its start minutes, so this height is the unit that
     percentage is measured against — changing it here needs no JS change, but dropping
     the fixed height entirely breaks the positioning. */
  .week-time-label { font-size:10px; color:var(--text-secondary); padding:4px 6px 0; text-align:right; height:40px; border-bottom:1px solid #f3f4f6; }
  .week-day-col { border-left:1px solid var(--border); border-bottom:1px solid #f3f4f6; height:40px; position:relative; cursor:pointer; transition:background .12s; }
  .week-day-col:hover { background:#f0fdf7; }
  .week-event-block { position:absolute; left:2px; right:2px; border-radius:5px; padding:2px 5px; font-size:10px; font-weight:600; overflow:hidden; cursor:pointer; z-index:1; }

  /* ── List view ────────────────────────────────────────────── */
  .list-group { margin-bottom:16px; }
  .list-group-label { font-size:11px; font-weight:700; color:var(--text-secondary); letter-spacing:.5px; margin-bottom:8px; text-transform:uppercase; }
  .list-event-card { display:flex; align-items:flex-start; gap:14px; padding:14px 16px; background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-sm); margin-bottom:8px; transition:box-shadow .15s; }
  .list-event-card:hover { box-shadow:var(--shadow-md); }
  .list-event-time { width:80px; flex-shrink:0; }
  .list-event-time-start { font-size:14px; font-weight:700; color:var(--text-primary); }
  .list-event-time-end   { font-size:12px; color:var(--text-secondary); }
  .list-event-body { flex:1; min-width:0; }
  .list-event-title { font-size:14px; font-weight:700; color:var(--text-primary); margin-bottom:2px; }
  .list-event-meta  { font-size:12px; color:var(--text-secondary); }
  .list-event-link  { display:inline-flex; align-items:center; gap:5px; margin-top:6px; font-size:12px; font-weight:600; text-decoration:none; padding:4px 10px; border-radius:6px; transition:opacity .15s; }
  .list-event-link:hover { opacity:.8; }
  .list-event-link.zoom  { background:#e8f0ff; color:#1a56db; }
  .list-event-link.meet  { background:#fce8ff; color:#7c3aed; }
  .list-event-link.teams { background:#e8f5ff; color:#0369a1; }
  .list-event-link.other { background:var(--accent-light); color:var(--accent); }
  .event-type-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; margin-top:4px; }

  /* ── Sidebar event form ───────────────────────────────────── */
  .form-section-label { font-size:11px; font-weight:700; color:var(--text-secondary); letter-spacing:.5px; text-transform:uppercase; margin-bottom:10px; }
  /* Hidden until a type modifier is added: each modifier below re-enables display.
     The JS hides the banner by resetting className back to the bare class name. */
  .url-parse-feedback { font-size:12px; margin-top:5px; padding:6px 10px; border-radius:6px; display:none; }
  .url-parse-feedback.zoom  { background:#e8f0ff; color:#1a56db; display:block; }
  .url-parse-feedback.meet  { background:#fce8ff; color:#7c3aed; display:block; }
  .url-parse-feedback.teams { background:#e8f5ff; color:#0369a1; display:block; }
  .url-parse-feedback.other { background:var(--accent-light); color:var(--accent); display:block; }
  .url-parse-feedback.error { background:#fef2f2; color:#b91c1c; display:block; }
  /* showErr() toggles .visible on and auto-clears it after 3.5s. */
  .form-error { color:#ef4444; font-size:12px; margin-top:6px; display:none; }
  .form-error.visible { display:block; }

  /* ── Event detail modal ───────────────────────────────────── */
  /* Built by openEventModal() and appended to document.body, i.e. OUTSIDE the injected
     page fragment — the backdrop must therefore be fixed-position and out-rank the app
     shell's own chrome. It is also why the modal has to remove itself explicitly. */
  .modal-backdrop { position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:500; display:flex; align-items:center; justify-content:center; }
  .modal { background:#fff; border-radius:var(--radius); padding:28px; width:460px; box-shadow:var(--shadow-md); max-height:90vh; overflow-y:auto; }
  .modal-header { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:20px; }
  .modal-title { font-size:18px; font-weight:700; color:var(--text-primary); }
  .modal-close { background:none; border:none; font-size:20px; cursor:pointer; color:var(--text-secondary); padding:0; line-height:1; }
  .modal-detail-row { display:flex; gap:10px; align-items:flex-start; margin-bottom:12px; font-size:14px; }
  .modal-detail-icon { width:20px; flex-shrink:0; text-align:center; }
  .modal-actions { display:flex; gap:10px; justify-content:flex-end; margin-top:20px; border-top:1px solid var(--border); padding-top:16px; }

  .empty-cal { text-align:center; padding:48px 20px; color:var(--text-secondary); }
  .empty-cal-icon { font-size:40px; margin-bottom:12px; }
</style>

<div class="page-header">
  <div style="display:flex; align-items:center; justify-content:space-between;">
    <div>
      <div class="page-title">Calendar</div>
      <div class="page-subtitle">Manage your study sessions, classes, and meetings.</div>
    </div>
    <!-- data-view is the source of truth for the active view: the click handler copies
         it straight into `currentView`, so these strings must match the render dispatcher. -->
    <div class="view-toggle">
      <button class="view-btn active" data-view="month">Month</button>
      <button class="view-btn" data-view="week">Week</button>
      <button class="view-btn" data-view="list">List</button>
    </div>
  </div>
</div>

<div class="cal-wrap">
  <!-- Left: calendar view -->
  <div class="cal-main">
    <div class="cal-nav">
      <div class="cal-nav-title" id="calNavTitle"></div>
      <div class="cal-nav-btns">
        <button class="btn btn-ghost cal-nav-btn" id="calPrev">‹</button>
        <button class="btn btn-ghost cal-nav-btn" id="calToday" style="font-size:13px;padding:6px 12px;">Today</button>
        <button class="btn btn-ghost cal-nav-btn" id="calNext">›</button>
      </div>
    </div>
    <!-- Every view renders into this one container by wholesale innerHTML replacement. -->
    <div id="calView"></div>
  </div>

  <!-- Right: add event form + upcoming -->
  <div class="cal-sidebar">

    <!-- Add Event Form.
         Clicking a month cell / week slot writes into these same inputs, so the form
         doubles as the "what did I just click" readout. addEvent() reads them by id. -->
    <div class="card">
      <div class="form-section-label">Add Event</div>

      <div class="input-group">
        <label>Event Title *</label>
        <input type="text" id="evTitle" placeholder="e.g. Calc Study Session" />
      </div>

      <div class="input-group">
        <label>Date *</label>
        <input type="date" id="evDate" />
      </div>

      <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
        <div class="input-group" style="margin:0;">
          <label>Start Time *</label>
          <input type="time" id="evStart" />
        </div>
        <div class="input-group" style="margin:0;">
          <label>End Time *</label>
          <input type="time" id="evEnd" />
        </div>
      </div>

      <div class="input-group" style="margin-top:12px;">
        <label>Meeting Link (Zoom, Google Meet, Teams…)</label>
        <!-- type="url" is cosmetic only (the field is never inside a <form>, so the
             browser never validates it); parseLink() is the real gate, and it tolerates
             a missing scheme by prepending https://. -->
        <input type="url" id="evLink" placeholder="https://zoom.us/j/… or meet.google.com/…" />
        <div class="url-parse-feedback" id="linkFeedback"></div>
      </div>

      <div class="input-group" style="margin-top:10px;">
        <label>Repeat</label>
        <!-- These option values are stored raw on the event as `repeat` and switched on
             by getExpandedEvents(). A new option here without a matching branch there
             falls into the `else break` and silently never recurs. -->
        <select id="evRepeat">
          <option value="none">Does not repeat</option>
          <option value="daily">Every day</option>
          <option value="weekly">Every week (same day)</option>
          <option value="biweekly">Every 2 weeks</option>
          <option value="monthly">Every month (same date)</option>
        </select>
      </div>

      <div class="form-error" id="evError"></div>
      <button class="btn btn-primary" style="width:100%; margin-top:4px;" id="addEvBtn">+ Add Event</button>
    </div>

    <!-- Upcoming events mini-list -->
    <div class="card">
      <div class="form-section-label">Upcoming (Next 7 Days)</div>
      <div id="upcomingMini"></div>
    </div>

  </div>
</div>

<script>
// IIFE: loadPage() re-executes this whole script in global scope on every visit to the
// page, so nothing below may leak a top-level binding. Only window._calDelete escapes,
// deliberately — inline onclick= can reach globals and nothing else.
(function() {
  /* ── Data helpers ─────────────────────────────────────────── */
  // Per-account storage (real key: cs_<user>_calEvents). Read fresh on every access
  // rather than cached in a module variable, so an edit from another page is picked up.
  function getEvents() { return csGetJSON('calEvents', []) }
  function saveEvents(e) { csSetJSON('calEvents', e) }

  // Expand recurring events for a date range
  //
  // Recurrence is stored, never materialised: one stored event + a `repeat` rule becomes
  // many read-only OCCURRENCES here at render time. Occurrences get a synthetic
  // `id` of `<parentId>_<date>` and keep the real id in `_parentId`; the `_`-prefixed
  // fields mark an object as derived and never-to-be-saved. Callers that need the stored
  // record (delete, modal) must resolve back through _parentId.
  //
  // Non-repeating events are passed through untouched regardless of the range — the
  // from/to bounds only constrain generated occurrences, so callers still filter.
  function getExpandedEvents(fromDate, toDate) {
    const base = getEvents()
    const results = []
    const from = new Date(fromDate), to = new Date(toDate)
    base.forEach(ev => {
      if (!ev.repeat || ev.repeat === 'none') { results.push(ev); return }
      // Generate occurrences
      const start = new Date(ev.date)
      let cur = new Date(start)
      let count = 0
      // The walk always starts at the event's ORIGINAL date and steps forward one
      // interval at a time until it reaches `to` — it does not jump to `from` first.
      // FIXME(high): `count < 200` is a runaway guard, but it counts steps from the
      // event's start date, not occurrences emitted. A daily event simply stops
      // appearing ~200 days after it began, silently and forever. See audit.
      while (cur <= to && count < 200) {
        if (cur >= from) {
          // FIXME(medium): toISOString() converts to UTC first, so `cur` (local midnight)
          // renders as the PREVIOUS day for any user west of UTC, and shifts by a day
          // across a DST spring-forward. localDateStr() below exists precisely to avoid
          // this and should be used here. See audit.
          const dateStr = cur.toISOString().slice(0,10)
          results.push({ ...ev, date: dateStr, id: `${ev.id}_${dateStr}`, _parentId: ev.id, _isRecurring: true })
        }
        // Advance by recurrence interval
        const next = new Date(cur)
        if (ev.repeat === 'daily')    next.setDate(next.getDate() + 1)
        else if (ev.repeat === 'weekly')   next.setDate(next.getDate() + 7)
        else if (ev.repeat === 'biweekly') next.setDate(next.getDate() + 14)
        // FIXME(high): setMonth() overflows rather than clamping — the 31st of Jan
        // becomes Mar 2/3, so February is skipped and every later occurrence stays on
        // the drifted day. "Same date" is not preserved. See audit.
        else if (ev.repeat === 'monthly')  next.setMonth(next.getMonth() + 1)
        // Unknown repeat value: emit the first occurrence only, never loop forever.
        else break
        // Belt-and-braces: if an interval failed to advance the date we would spin here
        // until `count` saves us, emitting 200 copies on the same day.
        if (next.getTime() === cur.getTime()) break
        cur = next; count++
      }
    })
    return results
  }

  /* ── URL parser ───────────────────────────────────────────── */
  // Single source of truth for meeting links. Returns {url, type, label, valid} where
  // `type` drives BOTH the CSS modifier class and the TYPE_ICONS lookup, and `url` is a
  // canonicalised form safe to hand to the OS browser.
  //
  // Note `valid` is only false for genuinely unparseable input. A recognised provider
  // with a suspicious-looking id still returns valid:true and merely says so in `label`
  // — the guiding rule is never to block the user from saving a link we simply do not
  // understand, since these formats change without notice.
  function parseLink(raw) {
    // Empty is a legitimate state (an event need not have a link), hence valid:true with
    // type 'none' rather than an error. Callers distinguish 'none' from 'error'.
    if (!raw || !raw.trim()) return { url: '', type: 'none', label: '', valid: true }
    let url = raw.trim()
    // Users paste "meet.google.com/abc-defg-hij" far more often than a full URL, and
    // new URL() would throw on it. Assume https rather than reject.
    if (!/^https?:\/\//i.test(url)) url = 'https://' + url

    try {
      const u = new URL(url)
      const host = u.hostname.toLowerCase()

      // Zoom: zoom.us/j/MEETINGID or zoom.us/my/VANITY
      // Zoom hands out many host variants (companyname.zoom.us, zoom.com), hence the
      // substring test rather than an equality check.
      if (host.includes('zoom.us') || host.includes('zoom.com')) {
        // /j/ = join, /my/ = personal room, /wc/ = web client. Rewrite all three to the
        // canonical /j/<id> form so the desktop Zoom client is offered the handoff;
        // u.search is preserved because it carries the ?pwd= passcode.
        const match = u.pathname.match(/\/(j|my|wc)\/([^/?]+)/)
        // Strip non-digits: a /my/ vanity room has no numeric id, which is why `id` may
        // legitimately be empty and we fall back to the URL as pasted.
        const id = match ? match[2].replace(/\D/g,'') : null
        const canonical = id
          ? `https://zoom.us/j/${id}${u.search}`
          : url
        return { url: canonical, type: 'zoom', label: `Zoom${id ? ` · ID ${id}` : ''}`, valid: true }
      }

      // Google Meet: meet.google.com/xxx-xxxx-xxx
      // Exact host match: Meet has exactly one hostname, so a substring test would let
      // lookalike domains through.
      if (host === 'meet.google.com') {
        const code = u.pathname.replace('/', '').trim()
        const valid = /^[a-z]{3}-[a-z]{4}-[a-z]{3}$/i.test(code)
        // Deliberately still valid:true on a malformed code — we only warn in the label.
        // Google has changed this code shape before and a hard reject would lock users
        // out of saving a working link.
        return {
          url: `https://meet.google.com/${code}`,
          type: 'meet',
          label: valid ? `Google Meet · ${code.toUpperCase()}` : 'Google Meet (check code format)',
          valid: true
        }
      }

      // Microsoft Teams
      if (host.includes('teams.microsoft.com') || host.includes('teams.live.com')) {
        return { url, type: 'teams', label: 'Microsoft Teams', valid: true }
      }

      // Generic https link
      if (u.protocol === 'https:' || u.protocol === 'http:') {
        return { url, type: 'other', label: `Link · ${u.hostname}`, valid: true }
      }

      // Reached only for an exotic scheme (file:, javascript:, …) that survived the
      // https:// prefixing above — refuse it rather than store something openExternal()
      // would later hand to the OS.
      return { url: '', type: 'error', label: 'Invalid URL — must start with https://', valid: false }
    } catch {
      // new URL() threw: unparseable even after prefixing.
      return { url: '', type: 'error', label: 'Could not parse URL — please check the link.', valid: false }
    }
  }

  /* ── Live URL feedback ────────────────────────────────────── */
  // Re-parses on every keystroke to show the detected provider before the user commits.
  // Purely advisory — addEvent() re-parses from scratch and does not trust this banner.
  //
  // NB: this callback reads TYPE_ICONS, which is declared with `const` near the BOTTOM of
  // this IIFE. That is safe only because the callback can never fire until the IIFE body
  // has finished running. Do not "tidy" this by calling it during setup.
  const linkInput = document.getElementById('evLink')
  const linkFeedback = document.getElementById('linkFeedback')
  linkInput.addEventListener('input', () => {
    const val = linkInput.value.trim()
    if (!val) { linkFeedback.className = 'url-parse-feedback'; return }
    const parsed = parseLink(val)
    if (parsed.type === 'none') { linkFeedback.className = 'url-parse-feedback'; return }
    linkFeedback.textContent = `${TYPE_ICONS[parsed.type] || ''} ${parsed.label}`
    linkFeedback.className = `url-parse-feedback ${parsed.type}`
  })

  /* ── HTML escape helper ───────────────────────────────────── */
  // Every view builds markup as strings and assigns it via innerHTML, so anything derived
  // from stored data MUST pass through esc(). Event titles and links are user-supplied,
  // and ids may originate outside this file (e.g. an event imported from an email).
  //
  // IMPORTANT: this is an HTML-TEXT/ATTRIBUTE escaper ONLY. It is NOT a JavaScript string
  // escaper. Inside an inline handler such as onclick="f('${esc(x)}')" the browser
  // HTML-decodes the attribute BEFORE the JS parser sees it, so esc()'s &#39; turns back
  // into a bare quote and closes the string. See the FIXMEs in openEventModal/renderList.
  function esc(s) {
    return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')
  }
  // Local-calendar-date formatter. Exists because toISOString() converts to UTC and can
  // land on the wrong day; use this anywhere a Date must become a stored 'YYYY-MM-DD'.
  function localDateStr(d = new Date()) {
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`
  }

  /* ── View state ───────────────────────────────────────────── */
  // The only mutable state on the page. Both are re-initialised on every visit (the whole
  // script re-runs), so the calendar always reopens on the current month — view choice is
  // intentionally not persisted.
  //
  // `cursor` means different things per view: in month view it is pinned to the 1st and
  // only its year/month matter; in week view it is any day inside the shown week.
  let currentView = 'month'
  let cursor = new Date()
  cursor.setDate(1)

  document.querySelectorAll('.view-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'))
      btn.classList.add('active')
      currentView = btn.dataset.view
      // Month view leaves cursor on the 1st; carrying that into week view would show the
      // week of the 1st rather than the current week, which reads as a bug to users.
      if (currentView === 'week') cursor = new Date()  // reset to this week
      render()
    })
  })

  // Prev/Today/Next step the cursor by whatever unit the current view shows.
  // Quirk worth knowing: in LIST view the ±30-day branch still mutates `cursor`, but
  // renderList() ignores the cursor entirely (it always shows all events), so the arrows
  // appear to do nothing there.
  document.getElementById('calPrev').addEventListener('click', () => {
    if (currentView === 'month') cursor.setMonth(cursor.getMonth() - 1)
    else if (currentView === 'week') cursor.setDate(cursor.getDate() - 7)
    else cursor.setDate(cursor.getDate() - 30)
    render()
  })
  document.getElementById('calNext').addEventListener('click', () => {
    if (currentView === 'month') cursor.setMonth(cursor.getMonth() + 1)
    else if (currentView === 'week') cursor.setDate(cursor.getDate() + 7)
    else cursor.setDate(cursor.getDate() + 30)
    render()
  })
  document.getElementById('calToday').addEventListener('click', () => {
    cursor = new Date()
    // Re-pin to the 1st: this invariant is what keeps the setMonth(±1) stepping above
    // free of the end-of-month overflow that bites getExpandedEvents' monthly rule.
    if (currentView === 'month') cursor.setDate(1)
    render()
  })

  /* ── Add event ────────────────────────────────────────────── */
  document.getElementById('addEvBtn').addEventListener('click', addEvent)
  document.getElementById('evTitle').addEventListener('keydown', e => { if (e.key==='Enter') addEvent() })

  // Default date to today
  // Must be localDateStr(), not toISOString() — otherwise the form can open pre-filled
  // with yesterday for users behind UTC.
  document.getElementById('evDate').value = localDateStr()

  // Validates, parses the link, appends to storage and re-renders. Returns early via
  // showErr() on the first problem (showErr returns undefined, so `return showErr(...)`
  // is just an early-exit idiom, not a meaningful value).
  function addEvent() {
    const title = document.getElementById('evTitle').value.trim()
    const date  = document.getElementById('evDate').value
    const start = document.getElementById('evStart').value
    const end   = document.getElementById('evEnd').value
    const rawLink = document.getElementById('evLink').value.trim()
    const errEl = document.getElementById('evError')
    errEl.classList.remove('visible')

    if (!title) return showErr(errEl, 'Event title is required.')
    if (!date)  return showErr(errEl, 'Date is required.')
    if (!start) return showErr(errEl, 'Start time is required.')
    if (!end)   return showErr(errEl, 'End time is required.')
    // String comparison is valid ordering here: <input type="time"> always yields
    // zero-padded 24h "HH:MM". Consequence: events cannot cross midnight.
    if (end <= start) return showErr(errEl, 'End time must be after start time.')

    const parsed = parseLink(rawLink)
    // Only block on an INVALID link; an empty link is a normal event with no meeting.
    if (rawLink && !parsed.valid) return showErr(errEl, parsed.label)

    const repeat = document.getElementById('evRepeat')?.value || 'none'
    // Read-modify-write against storage rather than an in-memory list: keeps this page
    // correct when another page has mutated calEvents since the last render.
    const events = getEvents()
    events.push({
      // Millisecond timestamp as id. Unique enough in practice for hand-entered events,
      // but note ids are the join key used by every click handler and by _calDelete, and
      // events created elsewhere may carry ids this file never generated.
      id: Date.now().toString(),
      title, date, start, end,
      // Denormalised on purpose: the canonical url, its type and its display label are
      // frozen at save time so rendering never has to re-parse. Changing parseLink()
      // therefore does NOT retroactively fix already-saved events.
      link: parsed.url,
      linkType: parsed.type,
      linkLabel: parsed.label,
      repeat,
    })
    saveEvents(events)

    // Reset form (keep date)
    // Date and Repeat are intentionally left as-is: adding several events to the same day
    // is the common case, so re-typing the date every time would be hostile.
    document.getElementById('evTitle').value = ''
    document.getElementById('evStart').value = ''
    document.getElementById('evEnd').value   = ''
    document.getElementById('evLink').value  = ''
    linkFeedback.className = 'url-parse-feedback'

    render()
  }

  function showErr(el, msg) { el.textContent = msg; el.classList.add('visible'); setTimeout(() => el.classList.remove('visible'), 3500) }

  /* ── Delete event ─────────────────────────────────────────── */
  window._calDelete = (id) => {
    if (!confirm('Delete this event?')) return
    saveEvents(getEvents().filter(e => e.id !== id))
    render()
    // Close modal if open
    document.querySelectorAll('.modal-backdrop').forEach(m => m.remove())
  }

  /* ── Event detail modal ───────────────────────────────────── */
  function openEventModal(ev) {
    const linkHtml = ev.link
      ? `<a class="list-event-link ${esc(ev.linkType)}" href="${esc(ev.link)}" target="_blank">
           ${TYPE_ICONS[ev.linkType]||'🔗'} ${esc(ev.linkLabel || 'Open Link')}
         </a>`
      : '<span style="color:var(--text-secondary);font-size:13px;">No meeting link</span>'

    const joinNotesBtn = ev.link
      ? `<button class="btn btn-primary" id="mJoinNotes" style="background:#5b21b6;">Join &amp; Take Notes</button>`
      : ''

    const modal = document.createElement('div')
    modal.className = 'modal-backdrop'
    modal.innerHTML = `
      <div class="modal">
        <div class="modal-header">
          <div class="modal-title">${esc(ev.title)}</div>
          <button class="modal-close" id="mClose">✕</button>
        </div>
        <div class="modal-detail-row"><div class="modal-detail-icon">📅</div><div>${formatDate(ev.date)}</div></div>
        <div class="modal-detail-row"><div class="modal-detail-icon">🕐</div><div>${fmt12(ev.start)} – ${fmt12(ev.end)} (${duration(ev.start, ev.end)})</div></div>
        <div class="modal-detail-row"><div class="modal-detail-icon">🔗</div><div>${linkHtml}</div></div>
        <div class="modal-actions">
          <button class="btn btn-ghost" style="color:#ef4444;border-color:#ef4444;" onclick="window._calDelete('${esc(ev.id)}')">Delete</button>
          ${joinNotesBtn}
          <button class="btn btn-primary" id="mDone">Done</button>
        </div>
      </div>`

    document.body.appendChild(modal)
    modal.querySelector('#mClose').addEventListener('click', () => modal.remove())
    modal.querySelector('#mDone').addEventListener('click',  () => modal.remove())
    modal.addEventListener('click', e => { if (e.target === modal) modal.remove() })

    if (ev.link) {
      modal.querySelector('#mJoinNotes').addEventListener('click', () => {
        // Open the meeting URL in the default browser
        if (window.api) window.api.openExternal(ev.link)

        // Package event data so meetings.html can pre-fill the notes editor
        window._pendingMeetingNote = {
          title:    ev.title,
          date:     ev.date,
          start:    ev.start,
          end:      ev.end,
          link:     ev.link,
          linkType: ev.linkType || 'other',
          linkLabel:ev.linkLabel || 'Meeting Link',
        }

        modal.remove()
        window.navigateTo('meetings')
      })
    }
  }

  /* ── Render dispatcher ────────────────────────────────────── */
  function render() {
    if (currentView === 'month') renderMonth()
    else if (currentView === 'week') renderWeek()
    else renderList()
    renderUpcomingMini()
  }

  /* ── Month view ───────────────────────────────────────────── */
  const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December']
  const DAYS   = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat']

  function renderMonth() {
    const year = cursor.getFullYear(), month = cursor.getMonth()
    document.getElementById('calNavTitle').textContent = `${MONTHS[month]} ${year}`

    const fromDate = new Date(year, month, 1)
    const toDate   = new Date(year, month+1, 0)
    const events = getExpandedEvents(fromDate.toISOString().slice(0,10), toDate.toISOString().slice(0,10))
    const today  = new Date()
    const firstDow = new Date(year, month, 1).getDay()
    const daysInMonth = new Date(year, month+1, 0).getDate()
    const daysInPrev  = new Date(year, month, 0).getDate()
    const totalCells  = Math.ceil((firstDow + daysInMonth) / 7) * 7

    let html = `<div class="month-grid">`
    DAYS.forEach(d => html += `<div class="month-header-cell">${d}</div>`)

    for (let i = 0; i < totalCells; i++) {
      let day, monthOffset = 0
      if (i < firstDow) { day = daysInPrev - firstDow + i + 1; monthOffset = -1 }
      else if (i >= firstDow + daysInMonth) { day = i - firstDow - daysInMonth + 1; monthOffset = 1 }
      else { day = i - firstDow + 1 }

      const cellMonth = month + monthOffset
      const cellYear  = cellMonth < 0 ? year-1 : cellMonth > 11 ? year+1 : year
      const cm        = ((cellMonth % 12) + 12) % 12
      const dateStr   = `${cellYear}-${String(cm+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`
      const isToday   = day===today.getDate() && cm===today.getMonth() && cellYear===today.getFullYear()
      const isOther   = monthOffset !== 0

      const dayEvs = events.filter(e => e.date === dateStr).sort((a,b) => a.start.localeCompare(b.start))
      const maxShow = 3
      const shown   = dayEvs.slice(0, maxShow)
      const extra   = dayEvs.length - maxShow

      html += `<div class="month-cell${isOther?' other-month':''}${isToday?' today':''}" data-date="${dateStr}">`
      html += `<div class="day-num">${day}</div>`
      html += `<div class="day-events">`
      shown.forEach(ev => {
        html += `<div class="event-pill ${esc(ev.linkType||'other')}" data-id="${esc(ev.id)}" title="${esc(ev.title+' '+ev.start+'–'+ev.end)}">${ev.start ? fmt12short(ev.start)+' ' : ''}${esc(ev.title)}</div>`
      })
      if (extra > 0) html += `<div class="more-label">+${extra} more</div>`
      html += `</div></div>`
    }

    html += '</div>'
    document.getElementById('calView').innerHTML = html

    // Wire month cell clicks
    document.querySelectorAll('.month-cell').forEach(cell => {
      cell.addEventListener('click', e => {
        if (e.target.closest('.event-pill')) return  // pill handles itself
        document.getElementById('evDate').value = cell.dataset.date
      })
    })
    document.querySelectorAll('.event-pill').forEach(pill => {
      pill.addEventListener('click', e => {
        e.stopPropagation()
        const ev = getEvents().find(e => e.id === pill.dataset.id)
        if (ev) openEventModal(ev)
      })
    })
  }

  /* ── Week view ────────────────────────────────────────────── */
  function renderWeek() {
    const today = new Date()
    const startOfWeek = new Date(cursor)
    const dow = startOfWeek.getDay()
    startOfWeek.setDate(startOfWeek.getDate() - dow)
    const endOfWeek = new Date(startOfWeek)
    endOfWeek.setDate(endOfWeek.getDate() + 6)

    const startLabel = `${MONTHS[startOfWeek.getMonth()].slice(0,3)} ${startOfWeek.getDate()}`
    const endLabel   = `${MONTHS[endOfWeek.getMonth()].slice(0,3)} ${endOfWeek.getDate()}, ${endOfWeek.getFullYear()}`
    document.getElementById('calNavTitle').textContent = `${startLabel} – ${endLabel}`

    const events = getEvents()
    const hours = Array.from({length:24}, (_,i) => i)
    const weekDays = Array.from({length:7}, (_,i) => {
      const d = new Date(startOfWeek)
      d.setDate(d.getDate() + i)
      return d
    })

    let html = `<div class="week-grid">
      <div class="week-header-row">
        <div class="week-header-cell"></div>`
    weekDays.forEach(d => {
      const isToday = d.toDateString() === today.toDateString()
      html += `<div class="week-header-cell${isToday?' today-col':''}">${DAYS[d.getDay()]}<br><strong>${d.getDate()}</strong></div>`
    })
    html += `</div><div class="week-body">`

    hours.forEach(h => {
      const label = h === 0 ? '12 AM' : h < 12 ? `${h} AM` : h === 12 ? '12 PM' : `${h-12} PM`
      html += `<div class="week-time-label">${label}</div>`
      weekDays.forEach(d => {
        const ds = localDateStr(d)
        const hourEvs = events.filter(ev => {
          if (ev.date !== ds) return false
          const startH = parseInt(ev.start.split(':')[0])
          return startH === h
        })
        html += `<div class="week-day-col" data-date="${ds}" data-hour="${h}">`
        hourEvs.forEach(ev => {
          const startM = parseInt(ev.start.split(':')[1])
          const topPct = (startM / 60) * 100
          html += `<div class="week-event-block ${esc(ev.linkType||'other')}" style="top:${topPct}%;" data-id="${esc(ev.id)}">${esc(ev.title)}</div>`
        })
        html += '</div>'
      })
    })
    html += '</div></div>'
    document.getElementById('calView').innerHTML = html

    document.querySelectorAll('.week-event-block').forEach(el => {
      el.addEventListener('click', e => {
        e.stopPropagation()
        const ev = getEvents().find(e => e.id === el.dataset.id)
        if (ev) openEventModal(ev)
      })
    })
    document.querySelectorAll('.week-day-col').forEach(col => {
      col.addEventListener('click', e => {
        if (e.target.closest('.week-event-block')) return
        document.getElementById('evDate').value = col.dataset.date
        const h = parseInt(col.dataset.hour)
        document.getElementById('evStart').value = `${String(h).padStart(2,'0')}:00`
        document.getElementById('evEnd').value   = `${String(Math.min(h+1,23)).padStart(2,'0')}:00`
      })
    })
  }

  /* ── List view ────────────────────────────────────────────── */
  function renderList() {
    const today = localDateStr()
    const events = getEvents().sort((a,b) => (a.date+a.start).localeCompare(b.date+b.start))
    document.getElementById('calNavTitle').textContent = 'All Events'

    if (!events.length) {
      document.getElementById('calView').innerHTML = `<div class="empty-cal"><div class="empty-cal-icon">📭</div>No events yet. Add one using the form →</div>`
      return
    }

    // Group by date
    const groups = {}
    events.forEach(ev => {
      if (!groups[ev.date]) groups[ev.date] = []
      groups[ev.date].push(ev)
    })

    let html = ''
    Object.entries(groups).sort().forEach(([date, evs]) => {
      const isPast = date < today
      const label  = date === today ? 'Today' : formatDate(date)
      html += `<div class="list-group${isPast?' style="opacity:.6"':''}"><div class="list-group-label">${label}</div>`
      evs.forEach(ev => {
        const linkHtml = ev.link
          ? `<a class="list-event-link ${esc(ev.linkType)}" href="${esc(ev.link)}" target="_blank">${TYPE_ICONS[ev.linkType]||'🔗'} ${esc(ev.linkLabel||'Open')}</a>`
          : ''
        html += `
          <div class="list-event-card">
            <div class="event-type-dot" style="background:${dotColor(ev.linkType)};"></div>
            <div class="list-event-time">
              <div class="list-event-time-start">${esc(fmt12(ev.start))}</div>
              <div class="list-event-time-end">${esc(fmt12(ev.end))}</div>
            </div>
            <div class="list-event-body">
              <div class="list-event-title">${esc(ev.title)}</div>
              <div class="list-event-meta">${esc(duration(ev.start, ev.end))}</div>
              ${linkHtml}
            </div>
            <button class="btn-icon" title="Delete" onclick="window._calDelete('${esc(ev.id)}')">Delete</button>
          </div>`
      })
      html += '</div>'
    })
    document.getElementById('calView').innerHTML = html
  }

  /* ── Upcoming mini (sidebar) ──────────────────────────────── */
  function renderUpcomingMini() {
    const today = localDateStr()
    const cutoff = new Date(); cutoff.setDate(cutoff.getDate() + 7)
    const cutoffStr = localDateStr(cutoff)

    const upcoming = getExpandedEvents(today, cutoffStr)
      .filter(e => e.date >= today && e.date <= cutoffStr)
      .sort((a,b) => (a.date+a.start).localeCompare(b.date+b.start))
      .slice(0, 6)

    const el = document.getElementById('upcomingMini')
    if (!upcoming.length) {
      el.innerHTML = '<div style="color:var(--text-secondary);font-size:13px;text-align:center;padding:16px 0;">Nothing in the next 7 days.</div>'
      return
    }
    el.innerHTML = upcoming.map(ev => `
      <div style="display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);align-items:center;cursor:pointer;" data-id="${esc(ev.id)}">
        <div class="event-type-dot" style="background:${dotColor(ev.linkType)};margin-top:0;"></div>
        <div style="flex:1;min-width:0;">
          <div style="font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(ev.title)}</div>
          <div style="font-size:11px;color:var(--text-secondary);">${ev.date===today?'Today':esc(formatDate(ev.date))} · ${esc(fmt12(ev.start))}</div>
        </div>
      </div>`).join('')

    el.querySelectorAll('[data-id]').forEach(row => {
      row.addEventListener('click', () => {
        const ev = getEvents().find(e => e.id === row.dataset.id)
        if (ev) openEventModal(ev)
      })
    })
  }

  /* ── Helpers ──────────────────────────────────────────────── */
  const TYPE_ICONS = { zoom:'🎥', meet:'📹', teams:'💼', other:'🔗', error:'⚠️', none:'' }

  function dotColor(type) {
    return { zoom:'#1a56db', meet:'#7c3aed', teams:'#0369a1', other:'#3aa876', none:'#9ca3af' }[type] || '#3aa876'
  }

  function fmt12(t) {
    if (!t) return ''
    const [h, m] = t.split(':').map(Number)
    const ampm = h >= 12 ? 'PM' : 'AM'
    const hr = h % 12 || 12
    return `${hr}:${String(m).padStart(2,'0')} ${ampm}`
  }

  function fmt12short(t) {
    if (!t) return ''
    const [h, m] = t.split(':').map(Number)
    const ampm = h >= 12 ? 'p' : 'a'
    return `${h%12||12}${m>0?':'+String(m).padStart(2,'0'):''}${ampm}`
  }

  function duration(start, end) {
    if (!start || !end) return ''
    const [sh, sm] = start.split(':').map(Number)
    const [eh, em] = end.split(':').map(Number)
    const mins = (eh*60+em) - (sh*60+sm)
    if (mins <= 0) return ''
    return mins < 60 ? `${mins} min` : `${Math.floor(mins/60)}h${mins%60>0?' '+mins%60+'m':''}`
  }

  function formatDate(ds) {
    const d = new Date(ds + 'T12:00:00')
    return d.toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' })
  }

  render()
})()
</script>
