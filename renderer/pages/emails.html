<style>
  .inbox-toolbar { display:flex; align-items:center; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
  .inbox-count { font-size:13px; color:var(--text-secondary); margin-left:auto; }
  .auto-toggle { display:flex; align-items:center; gap:6px; font-size:13px; cursor:pointer; }

  .email-list { display:flex; flex-direction:column; gap:8px; }
  .email-card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius-sm); padding:16px 18px; cursor:pointer; transition:border-color .15s; }
  .email-card:hover { border-color:var(--accent); }
  .email-card.expanded { border-color:var(--accent); }
  .email-header { display:flex; align-items:flex-start; gap:12px; }
  .email-avatar { width:36px; height:36px; border-radius:50%; background:var(--accent-light); color:var(--accent); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; flex-shrink:0; }
  .email-meta { flex:1; min-width:0; }
  .email-from { font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .email-subject { font-size:13px; color:var(--text-secondary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:1px; }
  .email-date { font-size:11px; color:var(--text-secondary); flex-shrink:0; white-space:nowrap; }
  .meeting-badge { display:inline-flex; align-items:center; gap:5px; background:#fef3c7; color:#b45309; border:1px solid #fcd34d; border-radius:99px; font-size:11px; font-weight:700; padding:3px 9px; margin-top:6px; }
  .email-body { margin-top:12px; padding-top:12px; border-top:1px solid var(--border); display:none; }
  .email-card.expanded .email-body { display:block; }
  .email-summary { font-size:13px; color:var(--text-secondary); line-height:1.6; margin-bottom:12px; white-space:pre-wrap; }
  .meeting-box { background:var(--accent-light); border:1px solid rgba(42,122,90,.2); border-radius:8px; padding:12px 14px; margin-bottom:12px; }
  .meeting-box h4 { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; color:var(--accent); margin-bottom:8px; }
  .meeting-row { display:flex; align-items:center; gap:7px; font-size:13px; margin-bottom:4px; }
  .meeting-row svg { width:14px; height:14px; color:var(--accent); flex-shrink:0; }
  .meeting-actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }

  .hint-box { background:var(--card); border:1px solid var(--border); border-radius:var(--radius-sm); padding:20px 24px; display:flex; align-items:flex-start; gap:14px; margin-bottom:16px; }
  .hint-box svg { width:22px; height:22px; color:var(--accent); flex-shrink:0; margin-top:2px; }
  .hint-box p { font-size:13px; color:var(--text-secondary); line-height:1.6; margin:0; }
  .hint-box strong { color:var(--text-primary); }

  .status-line { font-size:13px; padding:8px 0; }
  .status-line.err { color:#ef4444; }

  .imap-section { margin-top:20px; }
  .imap-toggle { background:none; border:none; cursor:pointer; font-size:13px; color:var(--accent); display:flex; align-items:center; gap:6px; padding:0; font-family:inherit; }
  .imap-toggle svg { transition:transform .2s; }
  .imap-toggle.open svg { transform:rotate(90deg); }
  .imap-form { display:none; margin-top:14px; padding:18px; background:var(--card); border:1px solid var(--border); border-radius:var(--radius-sm); }
  .imap-form.visible { display:block; }
  .imap-row { display:flex; gap:10px; margin-bottom:10px; flex-wrap:wrap; }
  .imap-field { display:flex; flex-direction:column; gap:4px; flex:1; min-width:140px; }
  .imap-field label { font-size:11px; font-weight:600; color:var(--text-secondary); text-transform:uppercase; letter-spacing:.4px; }
  .imap-field input { background:var(--bg); border:1px solid var(--border); border-radius:6px; padding:7px 10px; font-size:13px; color:var(--text-primary); font-family:inherit; outline:none; }
  .imap-field input:focus { border-color:var(--accent); }
  .preset-row { display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
  .preset-btn { padding:5px 12px; font-size:12px; border:1px solid var(--border); border-radius:99px; background:var(--card); cursor:pointer; color:var(--text-secondary); transition:all .15s; font-family:inherit; }
  .preset-btn:hover { border-color:var(--accent); color:var(--accent); }
</style>

<div class="page-header">
  <div class="page-title">Email Inbox</div>
  <div class="page-subtitle" id="emailSubtitle">Reading from your email client — no passwords needed.</div>
</div>

<div class="hint-box" id="hintBox">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01" stroke-linecap="round"/></svg>
  <p id="hintText"><strong>How it works:</strong> Loading…</p>
</div>

<div class="card">
  <div class="inbox-toolbar">
    <button class="btn btn-primary" id="fetchBtn">Loading…</button>
    <label class="auto-toggle">
      <input type="checkbox" id="autoAddChk" style="accent-color:var(--accent);"/>
      Auto-add meetings to Calendar
    </label>
    <span class="inbox-count" id="inboxCount"></span>
  </div>
  <div class="status-line" id="statusLine" style="display:none;"></div>
  <div class="email-list" id="emailList"></div>

  <!-- IMAP fallback -->
  <div class="imap-section">
    <button class="imap-toggle" id="imapToggle">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" width="14" height="14"><path d="M6 4l4 4-4 4"/></svg>
      Connect Gmail or another account (IMAP)
    </button>
    <div class="imap-form" id="imapForm">
      <div class="preset-row">
        <button class="preset-btn" data-host="imap.gmail.com" data-port="993" data-tls="true">Gmail</button>
        <button class="preset-btn" data-host="outlook.office365.com" data-port="993" data-tls="true">Outlook</button>
        <button class="preset-btn" data-host="imap.mail.yahoo.com" data-port="993" data-tls="true">Yahoo</button>
      </div>
      <div class="imap-row">
        <div class="imap-field" style="flex:2">
          <label>Email address</label>
          <input type="email" id="imapUser" placeholder="you@gmail.com"/>
        </div>
        <div class="imap-field" style="flex:2">
          <label>App password</label>
          <input type="password" id="imapPass" placeholder="16-char app password"/>
        </div>
      </div>
      <div class="imap-row">
        <div class="imap-field">
          <label>IMAP host</label>
          <input type="text" id="imapHost" placeholder="imap.gmail.com"/>
        </div>
        <div class="imap-field" style="max-width:90px">
          <label>Port</label>
          <input type="number" id="imapPort" value="993"/>
        </div>
      </div>
      <p style="font-size:12px;color:var(--text-secondary);margin:8px 0 12px;">For Gmail, enable 2FA and use an <strong>App Password</strong> — not your main password.</p>
      <button class="btn btn-primary" id="imapFetchBtn" style="font-size:13px;padding:8px 18px;">Connect &amp; Fetch</button>
      <div class="status-line" id="imapStatus" style="display:none;margin-top:8px;"></div>
    </div>
  </div>
</div>

<script>
;(function(){
  const autoAddChk = document.getElementById('autoAddChk')
  autoAddChk.checked = localStorage.getItem('cs_email_autoAdd') === '1'
  autoAddChk.addEventListener('change', () =>
    localStorage.setItem('cs_email_autoAdd', autoAddChk.checked ? '1' : '0'))

  // ── Platform-aware hint & button label ──────────────────────────────
  const plt = navigator.platform || ''
  const isWin = plt.toLowerCase().includes('win')
  const isMac = plt.toLowerCase().includes('mac')

  const hintEl = document.getElementById('hintText')
  const fetchBtn = document.getElementById('fetchBtn')

  if (isMac) {
    hintEl.innerHTML = '<strong>How it works:</strong> Ur Study Bro reads emails directly from <strong>macOS Mail.app</strong>. Any account you\'ve added there — Gmail, iCloud, Outlook, Exchange — works automatically. No passwords or setup required.<br><br>On first use, macOS will ask you to grant <strong>Automation</strong> permission. Click OK.'
    fetchBtn.textContent = 'Fetch from Mail.app'
  } else if (isWin) {
    hintEl.innerHTML = '<strong>How it works:</strong> Ur Study Bro reads emails directly from <strong>Microsoft Outlook</strong>. Any account you\'ve added there — Microsoft 365, Exchange, Gmail — works automatically. No passwords needed.<br><br>Make sure Outlook is installed and you\'re signed in.'
    fetchBtn.textContent = 'Fetch from Outlook'
  } else {
    hintEl.innerHTML = '<strong>How it works:</strong> On Linux, use the <strong>IMAP</strong> section below to connect Gmail or any email account.'
    fetchBtn.textContent = 'Not available on Linux'
    fetchBtn.disabled = true
  }

  // ── Status helpers ──────────────────────────────────────────────────
  function status(msg, err) {
    const el = document.getElementById('statusLine')
    el.textContent = msg; el.style.display = msg ? 'block' : 'none'
    el.className = 'status-line' + (err ? ' err' : '')
  }
  function imapStatus(msg, err) {
    const el = document.getElementById('imapStatus')
    el.textContent = msg; el.style.display = msg ? 'block' : 'none'
    el.className = 'status-line' + (err ? ' err' : '')
  }

  // ── Native fetch ────────────────────────────────────────────────────
  fetchBtn.addEventListener('click', async () => {
    if (fetchBtn.disabled) return
    fetchBtn.disabled = true
    const orig = fetchBtn.textContent
    fetchBtn.textContent = 'Fetching…'
    status(isMac ? 'Opening Mail.app…' : 'Opening Outlook…')

    if (!window.api?.fetchEmails) {
      status('Only available in the desktop app.', true)
      fetchBtn.disabled = false; fetchBtn.textContent = orig; return
    }

    const res = await window.api.fetchEmails({ limit: 40 })
    fetchBtn.disabled = false; fetchBtn.textContent = orig

    if (res.error) { status('Error: ' + res.error, true); return }

    const emails = res.emails || []
    status(`Loaded ${emails.length} emails — ${emails.filter(e=>e.meeting).length} meetings found.`)
    document.getElementById('inboxCount').textContent = `${emails.length} emails`
    render(emails)

    if (autoAddChk.checked)
      emails.forEach(e => { if (e.meeting) addToCal(e) })
  })

  // ── IMAP toggle ─────────────────────────────────────────────────────
  const imapToggle = document.getElementById('imapToggle')
  const imapForm   = document.getElementById('imapForm')
  imapToggle.addEventListener('click', () => {
    const open = imapForm.classList.toggle('visible')
    imapToggle.classList.toggle('open', open)
  })

  // Preset buttons
  document.querySelectorAll('.preset-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.getElementById('imapHost').value = btn.dataset.host
      document.getElementById('imapPort').value = btn.dataset.port
    })
  })

  // ── IMAP fetch ──────────────────────────────────────────────────────
  document.getElementById('imapFetchBtn').addEventListener('click', async () => {
    const cfg = {
      user:  document.getElementById('imapUser').value.trim(),
      password: document.getElementById('imapPass').value,
      host:  document.getElementById('imapHost').value.trim() || 'imap.gmail.com',
      port:  parseInt(document.getElementById('imapPort').value) || 993,
      tls:   true,
      limit: 40,
    }
    if (!cfg.user || !cfg.password) { imapStatus('Enter your email and app password.', true); return }

    const btn = document.getElementById('imapFetchBtn')
    btn.disabled = true; btn.textContent = 'Connecting…'
    imapStatus('Connecting to ' + cfg.host + '…')

    if (!window.api?.fetchEmailsIMAP) {
      imapStatus('Only available in the desktop app.', true)
      btn.disabled = false; btn.textContent = 'Connect & Fetch'; return
    }

    const res = await window.api.fetchEmailsIMAP(cfg)
    btn.disabled = false; btn.textContent = 'Connect & Fetch'

    if (res.error) { imapStatus('Error: ' + res.error, true); return }

    const emails = res.emails || []
    imapStatus(`Loaded ${emails.length} emails — ${emails.filter(e=>e.meeting).length} meetings found.`)
    document.getElementById('inboxCount').textContent = `${emails.length} emails`
    render(emails)

    if (autoAddChk.checked)
      emails.forEach(e => { if (e.meeting) addToCal(e) })
  })

  // ── Render ───────────────────────────────────────────────────────────
  function render(emails) {
    const list = document.getElementById('emailList')
    list.innerHTML = ''
    if (!emails.length) {
      list.innerHTML = '<p style="color:var(--text-secondary);font-size:13px;padding:20px 0;">No emails found.</p>'
      return
    }
    emails.forEach(email => {
      const card = document.createElement('div')
      card.className = 'email-card'
      const init = (email.from.match(/([A-Za-z])/)?.[1] || '?').toUpperCase()
      const dateLabel = (() => { try { return new Date(email.date).toLocaleDateString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}) } catch { return email.date } })()
      const m = email.meeting

      card.innerHTML = `
        <div class="email-header">
          <div class="email-avatar">${init}</div>
          <div class="email-meta">
            <div class="email-from">${esc(email.from)}</div>
            <div class="email-subject">${esc(email.subject)}</div>
            ${m ? `<div class="meeting-badge"><svg viewBox="0 0 14 14" fill="currentColor" width="11" height="11"><path d="M1 3a1 1 0 011-1h10a1 1 0 011 1v1L7 8 1 4V3zm0 2.2V11a1 1 0 001 1h10a1 1 0 001-1V5.2L7 9.5 1 5.2z"/></svg>Meeting detected</div>` : ''}
          </div>
          <div class="email-date">${dateLabel}</div>
        </div>
        <div class="email-body">
          <div class="email-summary">${esc(email.text.slice(0,400).trim())}</div>
          ${m ? meetingHtml(m) : ''}
        </div>`

      card.querySelector('.email-header').addEventListener('click', () => card.classList.toggle('expanded'))
      card.querySelector('.add-cal-btn')?.addEventListener('click', e => { e.stopPropagation(); addToCal(email); showToast('Added to Calendar') })
      card.querySelector('.join-btn')?.addEventListener('click', e => { e.stopPropagation(); window.api?.openExternal?.(m.link) })
      list.appendChild(card)
    })
  }

  function meetingHtml(m) {
    return `<div class="meeting-box">
      <h4>Meeting Info</h4>
      ${m.dateStr||m.timeStr ? `<div class="meeting-row"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1" y="2" width="12" height="11" rx="1"/><path d="M4 1v2M10 1v2M1 6h12"/></svg>${esc((m.dateStr||'')+' '+(m.timeStr||'')).trim()}</div>` : ''}
      ${m.link ? `<div class="meeting-row"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 9l4-4M7 3h4v4M3 11h8"/></svg><span style="font-size:12px;color:var(--accent);word-break:break-all;">${esc(m.link.slice(0,60))}</span></div>` : ''}
    </div>
    <div class="meeting-actions">
      <button class="btn btn-primary add-cal-btn" style="padding:7px 14px;font-size:13px;">Add to Calendar</button>
      ${m.link ? `<button class="btn btn-ghost join-btn" style="padding:7px 14px;font-size:13px;">Join Meeting</button>` : ''}
    </div>`
  }

  function addToCal(email) {
    const m = email.meeting
    const events = csGetJSON('calEvents', [])
    if (events.find(e => e.id === 'em_'+email.id)) return

    let dateObj = new Date()
    if (m.dateStr) { const d = new Date(m.dateStr); if (!isNaN(d)) dateObj = d }
    if (m.timeStr) {
      const tm = m.timeStr.match(/(\d{1,2})(?::(\d{2}))?\s*(am|pm)?/i)
      if (tm) {
        let h = parseInt(tm[1]); const min = parseInt(tm[2]||'0')
        const ap = (tm[3]||'').toLowerCase()
        if (ap==='pm'&&h<12) h+=12; if(ap==='am'&&h===12) h=0
        dateObj.setHours(h, min, 0, 0)
      }
    }
    events.push({
      id: 'em_'+email.id,
      title: email.subject,
      date: dateObj.toISOString().slice(0,10),
      start: dateObj.toTimeString().slice(0,5),
      end: new Date(dateObj.getTime()+3600000).toTimeString().slice(0,5),
      link: m?.link||'',
      type: m?.link?.includes('zoom')?'zoom':m?.link?.includes('meet.google')?'meet':m?.link?.includes('teams')?'teams':'other',
      notes: `From: ${email.from}`,
      fromEmail: true,
    })
    csSetJSON('calEvents', events)
  }

  function showToast(msg) {
    let t = document.getElementById('emlToast')
    if (!t) { t = document.createElement('div'); t.id='emlToast'; t.style.cssText='position:fixed;bottom:24px;right:24px;background:#1e2228;color:#fff;border-radius:12px;padding:14px 20px;font-size:13px;font-weight:500;z-index:9000;box-shadow:0 8px 32px rgba(0,0,0,.3);'; document.body.appendChild(t) }
    t.textContent=msg; t.style.display='block'
    clearTimeout(t._t); t._t=setTimeout(()=>t.style.display='none',3000)
  }

  function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') }
})()
</script>
