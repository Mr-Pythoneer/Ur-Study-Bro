<!--
  ── ai.html — the AI Tutor chat ─────────────────────────────────────
  Loaded by loadPage() (re-runs on every visit; note the IIFE). A chat
  UI with a provider/model sidebar. Ollama (local, default) streams via
  window.api.ollamaStream; cloud providers go through window.aiChat.
  Provider/model/key persist in the GLOBAL localStorage keys ai_provider
  / ai_model_<p> / ai_key_<p> (shared across accounts by design).
  See the FIXMEs for the hidden Ollama hint and the auto-scroll target.
-->
<style>
  .ai-layout { display:flex; gap:20px; height:calc(100vh - 180px); min-height:400px; }

  /* ── Sidebar ── */
  .ai-sidebar { width:220px; flex-shrink:0; display:flex; flex-direction:column; gap:12px; }

  .provider-card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius-sm); padding:14px; }
  .provider-card label { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; color:var(--text-secondary); display:block; margin-bottom:6px; }
  .provider-card select, .provider-card input {
    width:100%; box-sizing:border-box; background:var(--bg); border:1px solid var(--border);
    border-radius:6px; padding:7px 9px; font-size:13px; color:var(--text-primary);
    font-family:inherit; outline:none; margin-bottom:10px;
  }
  .provider-card select:focus, .provider-card input:focus { border-color:var(--accent); }
  .provider-card input[type=password] { letter-spacing:.1em; }
  .key-hint { font-size:11px; color:var(--text-secondary); line-height:1.5; margin-top:-6px; margin-bottom:10px; }
  .key-hint a { color:var(--accent); text-decoration:none; cursor:pointer; }

  .persona-card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius-sm); padding:14px; flex:1; display:flex; flex-direction:column; }
  .persona-card label { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; color:var(--text-secondary); display:block; margin-bottom:6px; }
  .persona-card textarea { flex:1; resize:none; background:var(--bg); border:1px solid var(--border); border-radius:6px; padding:8px 10px; font-size:12px; font-family:inherit; color:var(--text-primary); outline:none; line-height:1.5; }
  .persona-card textarea:focus { border-color:var(--accent); }

  .new-chat-btn { width:100%; }
  .conv-item { position:relative; padding:7px 28px 7px 10px; border-radius:5px; cursor:pointer; transition:background .12s; }
  .conv-item:hover { background:var(--bg-main); }
  .conv-item.active { background:var(--accent-light); }
  .conv-title { font-size:12px; font-weight:600; color:var(--text-primary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .conv-meta  { font-size:10px; color:var(--text-secondary); margin-top:1px; }
  .conv-del   { position:absolute; right:6px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; color:var(--text-secondary); font-size:14px; opacity:0; transition:opacity .12s; padding:0 2px; }
  .conv-item:hover .conv-del { opacity:1; }

  /* ── Chat area ── */
  .ai-chat { flex:1; display:flex; flex-direction:column; min-width:0; }

  .chat-history { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:14px; padding:4px 2px; margin-bottom:14px; }
  .chat-history:empty::after { content:"Ask me anything — study help, explain a concept, quiz me, summarize your notes…"; color:var(--text-secondary); font-size:13px; display:block; text-align:center; margin-top:60px; }

  .msg { display:flex; gap:10px; align-items:flex-start; max-width:90%; }
  .msg.user { align-self:flex-end; flex-direction:row-reverse; }
  .msg-avatar { width:30px; height:30px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; }
  .msg.user  .msg-avatar { background:var(--accent); color:#fff; }
  .msg.ai    .msg-avatar { background:var(--accent-light); color:var(--accent); }
  .msg-bubble { padding:10px 14px; border-radius:14px; font-size:13px; line-height:1.65; }
  .msg.user  .msg-bubble { background:var(--accent); color:#fff; border-bottom-right-radius:4px; }
  .msg.ai    .msg-bubble { background:var(--card); border:1px solid var(--border); border-bottom-left-radius:4px; color:var(--text-primary); white-space:pre-wrap; }
  .msg.ai    .msg-bubble code { background:#f3f4f6; border-radius:4px; padding:1px 5px; font-family:monospace; font-size:12px; }
  .msg.ai    .msg-bubble pre  { background:#f3f4f6; border-radius:6px; padding:10px; overflow-x:auto; margin:8px 0; }
  .msg.ai    .msg-bubble pre code { background:none; padding:0; }
  .msg-time { font-size:10px; color:var(--text-secondary); margin-top:4px; text-align:right; }
  .msg.ai .msg-time { text-align:left; }

  .typing-bubble { display:flex; gap:5px; align-items:center; padding:12px 16px; }
  .typing-dot { width:7px; height:7px; border-radius:50%; background:var(--accent); opacity:.4; animation:tdot 1.2s infinite; }
  .typing-dot:nth-child(2) { animation-delay:.2s; }
  .typing-dot:nth-child(3) { animation-delay:.4s; }
  .stream-cursor { display:inline-block; color:var(--accent); animation:blink .7s step-end infinite; }
  @keyframes blink { 50% { opacity:0 } }
  @keyframes tdot { 0%,100%{opacity:.4;transform:translateY(0)} 50%{opacity:1;transform:translateY(-4px)} }

  .chat-input-row { display:flex; gap:10px; align-items:flex-end; }
  .chat-input-wrap { flex:1; background:var(--card); border:1.5px solid var(--border); border-radius:14px; display:flex; align-items:flex-end; padding:8px 12px; transition:border-color .15s; }
  .chat-input-wrap:focus-within { border-color:var(--accent); }
  #aiInput { flex:1; border:none; outline:none; background:transparent; font-family:inherit; font-size:13px; color:var(--text-primary); resize:none; max-height:140px; line-height:1.5; }
  .send-btn { width:38px; height:38px; border-radius:50%; background:var(--accent); border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:opacity .15s; }
  .send-btn:hover { opacity:.85; }
  .send-btn:disabled { opacity:.4; cursor:not-allowed; }
  .send-btn svg { width:16px; height:16px; color:#fff; }

  .quick-chips { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  .chip { padding:5px 12px; font-size:12px; border:1px solid var(--border); border-radius:99px; background:var(--card); cursor:pointer; color:var(--text-secondary); transition:all .15s; font-family:inherit; white-space:nowrap; }
  .chip:hover { border-color:var(--accent); color:var(--accent); }

  .no-key-banner { background:#fef3c7; border:1px solid #fcd34d; border-radius:var(--radius-sm); padding:12px 16px; font-size:13px; color:#92400e; margin-bottom:12px; display:none; }
  .no-key-banner.visible { display:block; }
</style>

<div class="page-header">
  <div class="page-title">AI Tutor</div>
  <div class="page-subtitle">Powered by Claude or GPT — ask anything, get explanations, quizzes, summaries.</div>
</div>

<div class="no-key-banner" id="noKeyBanner">
  Enter your API key in the sidebar to start chatting. Get a free Claude key at <strong>console.anthropic.com</strong>.
</div>

<div class="quick-chips" id="quickChips">
  <button class="chip" data-q="Explain this concept simply: ">Explain a concept</button>
  <button class="chip" data-q="Quiz me on: ">Quiz me</button>
  <button class="chip" data-q="Summarize this in bullet points: ">Summarize</button>
  <button class="chip" data-q="What are the key differences between ">Compare topics</button>
  <button class="chip" data-q="Give me a study plan for learning: ">Study plan</button>
  <button class="chip" data-q="Help me understand why I got this wrong: ">Debug my thinking</button>
</div>

<div class="ai-layout">

  <!-- Sidebar: settings -->
  <div class="ai-sidebar">
    <div class="provider-card">
      <label>AI Provider</label>
      <select id="providerSel">
        <option value="ollama">Local AI (Ollama) 🖥️</option>
        <option value="gemini">Gemini (Google) ✨</option>
        <option value="anthropic">Claude (Anthropic)</option>
        <option value="openai">ChatGPT (OpenAI)</option>
      </select>

      <label>Model</label>
      <select id="modelSel">
        <option value="claude-haiku-4-5-20251001">Claude Haiku (fast)</option>
        <option value="claude-sonnet-4-6">Claude Sonnet (smart)</option>
      </select>

      <div id="apiKeyRow">
        <label>API Key</label>
        <input type="password" id="apiKeyInput" placeholder="sk-ant-…" autocomplete="off"/>
        <div class="key-hint" id="keyHint">
          Get a free key at <a id="keyLink" onclick="window.api.openExternal('https://console.anthropic.com')">console.anthropic.com</a>
        </div>
      </div>

      <button class="btn btn-primary" style="width:100%;font-size:13px;" id="saveKeyBtn">Save Key</button>
    </div>

    <div class="persona-card">
      <label>System Prompt</label>
      <textarea id="systemPrompt">You are a friendly, concise study tutor. Help the student understand concepts clearly. Use examples, analogies, and bullet points. Keep answers focused and not too long unless asked to elaborate.</textarea>
    </div>

    <button class="btn btn-ghost new-chat-btn" id="newChatBtn">New chat</button>

    <!-- Conversation history sidebar -->
    <div style="border-top:1px solid var(--border);margin-top:12px;padding-top:12px;">
      <div style="font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--text-secondary);margin-bottom:8px;">Recent Chats</div>
      <div id="convSidebar" style="display:flex;flex-direction:column;gap:2px;max-height:220px;overflow-y:auto;"></div>
    </div>
  </div>

  <!-- Chat -->
  <div class="ai-chat">
    <div class="chat-history" id="chatHistory"></div>
    <div class="chat-input-row">
      <div class="chat-input-wrap">
        <textarea id="aiInput" rows="1" placeholder="Ask me anything…"></textarea>
      </div>
      <button class="send-btn" id="sendBtn" disabled title="Send">
        <svg viewBox="0 0 20 20" fill="currentColor"><path d="M2.94 17.94a1 1 0 001.38.35l13-7a1 1 0 000-1.74l-13-7a1 1 0 00-1.38 1.38L4.81 10l-1.87 6.56z"/></svg>
      </button>
    </div>
  </div>
</div>

<script>
;(function(){
  /* ── Persist settings ── */
  const providerSel  = document.getElementById('providerSel')
  const modelSel     = document.getElementById('modelSel')
  const apiKeyInput  = document.getElementById('apiKeyInput')
  const systemPrompt = document.getElementById('systemPrompt')
  const keyHint      = document.getElementById('keyHint')
  const keyLink      = document.getElementById('keyLink')
  const noKeyBanner  = document.getElementById('noKeyBanner')

  const MODELS = {
    ollama: [
      { value:'auto', label:'Auto (best for your hardware)' },
    ],
    gemini: [
      { value:'gemini-2.0-flash-lite', label:'Gemini 2.0 Flash Lite (fastest)' },
      { value:'gemini-2.0-flash',      label:'Gemini 2.0 Flash (fast)' },
      { value:'gemini-2.5-flash',      label:'Gemini 2.5 Flash (smart)' },
      { value:'gemini-2.5-pro',        label:'Gemini 2.5 Pro (best)' },
    ],
    anthropic: [
      { value:'claude-haiku-4-5-20251001', label:'Claude Haiku (fast)' },
      { value:'claude-sonnet-4-6',         label:'Claude Sonnet (smart)' },
    ],
    openai: [
      { value:'gpt-4o-mini', label:'GPT-4o mini (fast)' },
      { value:'gpt-4o',      label:'GPT-4o (smart)' },
    ],
  }

  // FIXME(medium): saveSettings only runs on the "Save" button. Changing the
  // provider/model dropdown doesn't persist, so a picked model is lost on the
  // next visit unless the user also clicks Save. Persist on change.
  function saveSettings() {
    localStorage.setItem('ai_provider', providerSel.value)
    localStorage.setItem('ai_model_' + providerSel.value, modelSel.value)
    localStorage.setItem('ai_key_'  + providerSel.value, apiKeyInput.value)
    localStorage.setItem('ai_system', systemPrompt.value)
  }

  function loadSettings() {
    const saved = localStorage.getItem('ai_provider') || 'ollama'
    providerSel.value = MODELS[saved] ? saved : 'ollama'
    syncModels()
    systemPrompt.value = localStorage.getItem('ai_system') ||
      'You are a friendly, concise study tutor. Help the student understand concepts clearly. Use examples, analogies, and bullet points. Keep answers focused and not too long unless asked to elaborate.'
  }

  function syncModels() {
    const p = providerSel.value
    modelSel.innerHTML = MODELS[p].map(m => `<option value="${m.value}">${m.label}</option>`).join('')
    const saved = localStorage.getItem('ai_model_' + p)
    if (saved) modelSel.value = saved
    apiKeyInput.value = localStorage.getItem('ai_key_' + p) || ''
    const isOllama = p === 'ollama'
    document.getElementById('apiKeyRow').style.display = isOllama ? 'none' : ''
    document.getElementById('saveKeyBtn').textContent = isOllama ? 'Saved ✓' : 'Save Key'

    if (isOllama) {
      // FIXME(low): keyHint lives inside #apiKeyRow, which was just hidden on the
      // line above for Ollama — so this install hint is written but never shown.
      keyHint.innerHTML = 'Runs on your device. Install Ollama from <a onclick="window.api.openExternal(\'https://ollama.com\')" style="color:var(--accent);cursor:pointer;">ollama.com</a>'
    } else if (p === 'gemini') {
      keyHint.innerHTML = 'Free key at <a onclick="window.api.openExternal(\'https://aistudio.google.com/apikey\')" style="color:var(--accent);cursor:pointer;">aistudio.google.com</a>'
    } else if (p === 'anthropic') {
      keyHint.innerHTML = 'Get a key at <a onclick="window.api.openExternal(\'https://console.anthropic.com\')" style="color:var(--accent);cursor:pointer;">console.anthropic.com</a>'
    } else {
      keyHint.innerHTML = 'Get a key at <a onclick="window.api.openExternal(\'https://platform.openai.com/api-keys\')" style="color:var(--accent);cursor:pointer;">platform.openai.com</a>'
    }
    apiKeyInput.placeholder = p === 'anthropic' ? 'sk-ant-…' : 'sk-…'

    checkKey()
  }

  function checkKey() {
    const isOllama = providerSel.value === 'ollama'
    const hasKey = isOllama || !!apiKeyInput.value.trim()
    document.getElementById('sendBtn').disabled = false // enable typing check handles this
    noKeyBanner.classList.toggle('visible', !hasKey)
  }

  providerSel.addEventListener('change', syncModels)
  apiKeyInput.addEventListener('input', checkKey)
  document.getElementById('saveKeyBtn').addEventListener('click', () => {
    saveSettings(); checkKey()
    document.getElementById('saveKeyBtn').textContent = 'Saved ✓'
    setTimeout(() => document.getElementById('saveKeyBtn').textContent = 'Save Key', 1500)
  })
  systemPrompt.addEventListener('change', saveSettings)

  loadSettings()

  /* ── Conversation persistence ── */
  const CONV_KEY = 'aiConversations'
  let convList = csGetJSON(CONV_KEY, [])   // [{id, title, ts, messages:[]}]
  let activeConvId = null

  function saveConversations() { csSetJSON(CONV_KEY, convList) }

  function newConversation(keepCurrent = false) {
    if (!keepCurrent && messages.length) {
      // Save current conv
      const existing = convList.find(c => c.id === activeConvId)
      if (existing) { existing.messages = messages; existing.ts = Date.now() }
      else convList.unshift({ id: activeConvId || Date.now(), title: messages[0]?.content?.slice(0,40) || 'Chat', ts: Date.now(), messages })
      if (convList.length > 20) convList = convList.slice(0, 20)
      saveConversations()
    }
    messages = []
    activeConvId = Date.now()
    document.getElementById('chatHistory').innerHTML = ''
    renderConvSidebar()
  }

  function loadConversation(id) {
    // Save current first
    if (messages.length && activeConvId) {
      const ex = convList.find(c => c.id === activeConvId)
      if (ex) { ex.messages = messages; ex.ts = Date.now() }
      else convList.unshift({ id: activeConvId, title: messages[0]?.content?.slice(0,40)||'Chat', ts: Date.now(), messages })
      saveConversations()
    }
    const conv = convList.find(c => c.id === id)
    if (!conv) return
    activeConvId = id
    messages = conv.messages || []
    document.getElementById('chatHistory').innerHTML = ''
    messages.forEach(m => addMessage(m.role, m.content, true))
    renderConvSidebar()
  }

  function deleteConversation(id) {
    convList = convList.filter(c => c.id !== id)
    saveConversations()
    if (activeConvId === id) newConversation(true)
    else renderConvSidebar()
  }

  function renderConvSidebar() {
    const sidebar = document.getElementById('convSidebar')
    if (!sidebar) return
    sidebar.innerHTML = convList.length
      ? convList.map(c => `
        <div class="conv-item ${c.id === activeConvId ? 'active' : ''}" onclick="loadConversation(${c.id})">
          <div class="conv-title">${esc(c.title || 'Chat')}</div>
          <div class="conv-meta">${new Date(c.ts).toLocaleDateString()}</div>
          <button class="conv-del" onclick="event.stopPropagation();deleteConversation(${c.id})" title="Delete">×</button>
        </div>`).join('')
      : '<div style="font-size:12px;color:var(--text-secondary);padding:12px 8px;">No saved chats yet</div>'
  }

  // Auto-save every message
  function persistCurrentConv() {
    if (!messages.length) return
    const title = messages[0]?.content?.slice(0,40) || 'Chat'
    const ex = convList.find(c => c.id === activeConvId)
    if (ex) { ex.messages = messages; ex.ts = Date.now(); ex.title = title }
    else { convList.unshift({ id: activeConvId, title, ts: Date.now(), messages }); if (convList.length > 20) convList.pop() }
    saveConversations()
    renderConvSidebar()
  }

  // Init active conversation
  activeConvId = Date.now()
  renderConvSidebar()

  /* ── Chat history ── */
  let messages = []  // {role, content}

  // bubbleId: if set, gives the inner bubble div that id (used for streaming updates)
  function addMessage(role, content, bubbleId = false) {
    const isReplay = bubbleId === true // backward-compat: old callers pass true for replay
    if (!isReplay && bubbleId !== true) {
      // Only push to messages array for real user/assistant messages, not streaming placeholders
      if (typeof bubbleId !== 'string') { messages.push({ role, content }); persistCurrentConv() }
    }
    const history = document.getElementById('chatHistory')

    const wrapper = document.createElement('div')
    wrapper.className = `msg ${role === 'user' ? 'user' : 'ai'}`

    const initials = role === 'user'
      ? (localStorage.getItem('cs_currentUser') || 'U')[0].toUpperCase()
      : 'AI'

    const formatted = role === 'assistant' ? formatAI(content) : esc(content)
    const idAttr = (typeof bubbleId === 'string') ? ` id="${bubbleId}"` : ''

    wrapper.innerHTML = `
      <div class="msg-avatar">${initials}</div>
      <div>
        <div class="msg-bubble"${idAttr}>${formatted}</div>
        <div class="msg-time">${new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'})}</div>
      </div>`
    history.appendChild(wrapper)
    history.scrollTop = history.scrollHeight
    return wrapper
  }

  const renderMarkdown = formatAI // alias for streaming path
  const saveChatHistory = () => persistCurrentConv()

  function showTyping() {
    const history = document.getElementById('chatHistory')
    const el = document.createElement('div')
    el.className = 'msg ai'; el.id = 'typingIndicator'
    el.innerHTML = `<div class="msg-avatar">AI</div><div class="msg-bubble typing-bubble"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>`
    history.appendChild(el)
    history.scrollTop = history.scrollHeight
  }

  function hideTyping() {
    document.getElementById('typingIndicator')?.remove()
  }

  function formatAI(text) {
    // Basic markdown-ish: code blocks, inline code, bold
    return esc(text)
      .replace(/```([^`]*?)```/gs, (_, c) => `<pre><code>${c.trim()}</code></pre>`)
      .replace(/`([^`]+?)`/g, '<code>$1</code>')
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.+?)\*/g, '<em>$1</em>')
  }

  function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') }

  /* ── Send ── */
  async function send(text) {
    text = text.trim(); if (!text) return
    const input = document.getElementById('aiInput')
    const sendBtn = document.getElementById('sendBtn')
    input.value = ''; input.style.height = ''
    sendBtn.disabled = true

    addMessage('user', text)

    const p = providerSel.value
    const resolvedModel = p === 'ollama'
      ? (localStorage.getItem('ai_model_ollama') || localStorage.getItem('ai_ollama_model') || 'gemma3:4b')
      : modelSel.value

    // ── Ollama: streaming path ──────────────────────────────────
    if (p === 'ollama') {
      // Create a placeholder message bubble that we'll fill token-by-token
      const msgId = 'stream-' + Date.now()
      addMessage('assistant', '', msgId)
      const bubble = document.getElementById(msgId)

      let full = ''
      window.api.offOllamaStream() // clear any leftover listeners

      window.api.onOllamaToken(token => {
        full += token
        if (bubble) bubble.innerHTML = renderMarkdown(full) + '<span class="stream-cursor">▍</span>'
        // Auto-scroll
        // FIXME(medium): the scroll container is #chatHistory, not #chatMessages —
        // this getElementById returns null, so streamed replies never auto-scroll.
        const chat = document.getElementById('chatMessages')
        if (chat) chat.scrollTop = chat.scrollHeight
      })

      window.api.onOllamaDone(() => {
        window.api.offOllamaStream()
        if (bubble) bubble.innerHTML = renderMarkdown(full)
        messages.push({ role: 'assistant', content: full })
        sendBtn.disabled = false
        saveChatHistory()
      })

      window.api.onOllamaError(err => {
        window.api.offOllamaStream()
        if (bubble) bubble.innerHTML = '⚠️ Ollama error: ' + esc(err)
        sendBtn.disabled = false
      })

      window.api.ollamaStream({
        model:        resolvedModel,
        systemPrompt: systemPrompt.value,
        messages:     messages.map(m => ({ role: m.role, content: m.content })),
      })
      return
    }

    // ── Other providers: existing non-streaming path ────────────
    showTyping()
    try {
      const res = await window.api.askAI({
        provider:     p,
        apiKey:       apiKeyInput.value.trim(),
        model:        resolvedModel,
        systemPrompt: systemPrompt.value,
        messages:     messages.map(m => ({ role: m.role, content: m.content })),
      })
      if (res.error) {
        addMessage('assistant', '⚠️ Error: ' + res.error)
      } else {
        addMessage('assistant', res.reply)
      }
    } catch (e) {
      addMessage('assistant', '⚠️ Error: ' + (e.message || 'Something went wrong.'))
    } finally {
      hideTyping()
      sendBtn.disabled = false
    }
  }

  document.getElementById('sendBtn').addEventListener('click', () => {
    send(document.getElementById('aiInput').value)
  })

  const input = document.getElementById('aiInput')
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault(); send(input.value)
    }
  })
  input.addEventListener('input', () => {
    input.style.height = 'auto'
    input.style.height = Math.min(input.scrollHeight, 140) + 'px'
    const isOllama = providerSel.value === 'ollama'
    document.getElementById('sendBtn').disabled = !input.value.trim() || (!isOllama && !apiKeyInput.value.trim())
  })

  /* ── Quick chips ── */
  document.getElementById('quickChips').addEventListener('click', e => {
    const chip = e.target.closest('.chip')
    if (!chip) return
    input.value = chip.dataset.q
    input.focus()
    input.dispatchEvent(new Event('input'))
  })

  /* ── New chat ── */
  document.getElementById('newChatBtn').addEventListener('click', () => {
    if (messages.length && !confirm('Start a new chat? This will save the current one.')) return
    newConversation()
  })

  // Expose for sidebar onclick
  window.loadConversation = loadConversation
  window.deleteConversation = deleteConversation
})()
</script>
